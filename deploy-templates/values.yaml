# Default values for claude-code-telemetry — a self-contained telemetry bundle:
# upstream opentelemetry-collector + prometheus + grafana + loki subcharts.
# No operator/CRD/platform prerequisites; every component is scoped to this
# bundle only (the bundled Prometheus scrapes a single static target — it will
# never discover or scrape anything else in the cluster).
#
#   helm install claude-code-telemetry . -n claude-code-telemetry --create-namespace
#
# The collector pipeline lives ONCE, in opentelemetry-collector.alternateConfig.
# Validate pipeline changes in the repo's local/ docker-compose stack first,
# then replicate them there.

nameOverride: ""
fullnameOverride: "claude-code-telemetry"

# OTLP entry points for laptops outside the cluster.
# gRPC (:4317) via ingress-nginx requires the GRPC backend protocol and TLS (HTTP/2);
# the plain HTTP host (:4318) works without TLS — clients then set
# OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf.
ingress:
  grpc:
    enabled: false
    host: otel.example.com
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: GRPC
    tls: []
    # - secretName: otel-grpc-tls
    #   hosts: [otel.example.com]
  http:
    enabled: false
    host: otel-http.example.com
    annotations: {}
    tls: []

# Ship config/grafana/dashboards/<scope>/*.json as ConfigMaps picked up by the bundled
# Grafana's dashboard sidecar (same label). Each scope subdirectory maps to a Grafana
# folder via the `folderAnnotation`; the sidecar's foldersFromFilesStructure creates them.
dashboards:
  enabled: true
  label: grafana_dashboard
  labelValue: "1"
  folderAnnotation: grafana_folder
  annotations: {}
  # Scope subdirectory (under config/grafana/dashboards/) -> Grafana folder title.
  folders:
    claude-code: Claude Code
    executive: Executive
    governance: Governance
    operational: Operational

# Collector — upstream chart, plain Deployment.
opentelemetry-collector:
  enabled: true
  fullnameOverride: otel-collector
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.156.0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
    promexporter:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP
    # Collector self-telemetry (otelcol_* internal metrics) for the "Collector Health" dashboard.
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP

  # THE collector pipeline (used verbatim — no merging with upstream-chart defaults).
  # Receives OTLP from Claude Code, fans metrics to Prometheus and events/logs to Loki.
  # `${env:VAR:-default}` knobs can be overridden via extraEnvs without touching the pipeline.
  alternateConfig:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    # The k8s Deployment's liveness/readiness probes target this endpoint (:13133);
    # harmless locally, required in the Helm bundle.
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    processors:
      batch:
        timeout: 5s
      # Tag everything so multiple sources (laptops, CI) are distinguishable in one backend.
      resource:
        attributes:
          - key: collector.env
            value: ${env:COLLECTOR_ENV:-k8s}
            action: upsert

      # Attribution enforcement (docs/analytics.md §4) — the server-side, user-unbypassable point.
      # 1) Missing business dimensions get the sentinel `unattributed` so the share of un-tagged
      #    spend is queryable (project="unattributed") instead of silently vanishing into an empty label.
      #    (`none` remains the *user-set* sentinel for "does not apply" — see §3.3 — so the two are distinguishable.)
      # 2) Jira keys are normalized to upper case and validated against ^[A-Z][A-Z0-9]*-[0-9]+$;
      #    anything else becomes `invalid` so a typo can't mint a bogus epic/story label.
      # 3) `project` is lower-cased and restricted to [a-z0-9._-] (a repository name).
      # Identical statements for metrics and logs so Prometheus labels and Loki labels agree.
      # NOTE: session.id / jira.story are deliberately NOT stripped here — see docs/analytics.md §3.2.
      transform/attribution:
        error_mode: ignore
        metric_statements: &attribution_statements
          - context: resource
            statements:
              - set(attributes["project"], "unattributed") where attributes["project"] == nil or attributes["project"] == ""
              - set(attributes["jira.epic"], "unattributed") where attributes["jira.epic"] == nil or attributes["jira.epic"] == ""
              - set(attributes["jira.story"], "unattributed") where attributes["jira.story"] == nil or attributes["jira.story"] == ""
              - set(attributes["project"], ConvertCase(attributes["project"], "lower"))
              - set(attributes["project"], "invalid") where not IsMatch(attributes["project"], "^[a-z0-9._-]+$")
              - set(attributes["jira.epic"], ConvertCase(attributes["jira.epic"], "upper")) where IsMatch(attributes["jira.epic"], "^[A-Za-z][A-Za-z0-9]*-[0-9]+$")
              - set(attributes["jira.epic"], "invalid") where not IsMatch(attributes["jira.epic"], "^([A-Z][A-Z0-9]*-[0-9]+|none|unattributed)$")
              - set(attributes["jira.story"], ConvertCase(attributes["jira.story"], "upper")) where IsMatch(attributes["jira.story"], "^[A-Za-z][A-Za-z0-9]*-[0-9]+$")
              - set(attributes["jira.story"], "invalid") where not IsMatch(attributes["jira.story"], "^([A-Z][A-Z0-9]*-[0-9]+|none|unattributed)$")
        log_statements: *attribution_statements

    exporters:
      # Metrics -> Prometheus scrape endpoint on :8889.
      # Claude Code metrics are OTel counters, so Prometheus names carry the unit + `_total` suffix
      # (claude_code.token.usage -> claude_code_token_usage_tokens_total,
      #  claude_code.cost.usage -> claude_code_cost_usage_USD_total,
      #  claude_code.session.count -> claude_code_session_count_total). Dashboards query these names.
      # resource_to_telemetry_conversion turns resource attrs (project, jira.ticket, user.email, ...)
      # into Prometheus labels so we can break tokens/cost down by them.
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true

      # Events/logs -> Loki native OTLP ingest. Resource attrs become Loki labels;
      # event attributes (tool_name, skill.name, agent.name, decision, ...) become
      # structured metadata.
      otlphttp/loki:
        endpoint: ${env:LOKI_ENDPOINT:-http://loki:3100/otlp}

      # `basic` keeps pod logs sane; flip to `detailed` only while debugging ingestion.
      debug:
        verbosity: ${env:DEBUG_VERBOSITY:-basic}

    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [resource, transform/attribution, batch]
          exporters: [prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [resource, transform/attribution, batch]
          exporters: [otlphttp/loki, debug]
      telemetry:
        logs:
          level: info
        # Collector self-observability: expose internal otelcol_* metrics on :8888 for the
        # "Collector Health" dashboard (Prometheus scrapes this as the `otel-collector` job).
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888

# Event store (grafana/loki subchart) — SingleBinary, filesystem storage,
# sized for the usage-audit event volume.
loki:
  enabled: true
  fullnameOverride: loki
  deploymentMode: SingleBinary
  # Namespace-scoped RBAC only — this bundle must not create cluster-wide resources.
  rbac:
    namespaced: true
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      # Claude Code event attributes arrive as OTLP structured metadata.
      allow_structured_metadata: true
      retention_period: 720h
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
  # Disable the scalable-mode targets and extras the subchart enables by default.
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false

# Metrics store (prometheus-community/prometheus subchart) — bundle-scoped:
# a single static scrape target, no cluster-wide discovery, no RBAC, and none
# of the cluster-monitoring extras (node-exporter, kube-state-metrics, ...).
prometheus:
  enabled: true
  fullnameOverride: prometheus
  rbac:
    create: false
  # Bundled Alertmanager (prometheus-community/alertmanager subchart). Routing config is mirrored
  # from local/alertmanager.yml (source of truth). Receivers post to Slack via an incoming webhook
  # read from a mounted Secret — create it before/after install (no restart needed):
  #   kubectl -n claude-code-telemetry create secret generic alertmanager-slack \
  #     --from-file=slack-webhook=./local/secrets/slack-webhook
  # (or provision it with External Secrets like `grafana-sso`).
  alertmanager:
    enabled: true
    fullnameOverride: alertmanager     # -> Service `alertmanager:9093`, matched by server.alertmanagers below
    persistence:
      enabled: true
      size: 1Gi
    extraSecretMounts:
      - name: slack
        mountPath: /etc/alertmanager/secrets
        secretName: alertmanager-slack
        readOnly: true
        optional: true                 # pod starts even before the Secret exists
    config:
      global:
        resolve_timeout: 5m
        # slack_api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'

      route:
        receiver: platform            # anything without an owner label lands with the stack owners
        group_by: [alertname, owner, project]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # First match wins: informational alerts are visible in the UI / Grafana but never notify.
          - matchers: [severity = info]
            receiver: "null"
          - matchers: [owner = finops]
            receiver: finops
            # spend spikes are daily signals; don't re-page every few hours
            repeat_interval: 24h
          - matchers: [owner = governance]
            receiver: governance
            repeat_interval: 24h
          - matchers: [owner = platform]
            receiver: platform
            # pipeline problems: keep nagging until fixed
            repeat_interval: 4h

      inhibit_rules:
        # If the collector cannot be scraped, every other Claude Code alert is noise — suppress them.
        - source_matchers: [alertname = ClaudeCodeCollectorScrapeDown]
          target_matchers: [alertname =~ "ClaudeCode.*", alertname != "ClaudeCodeCollectorScrapeDown"]
          equal: []
        # No telemetry at all also implies spend/attribution alerts are meaningless.
        - source_matchers: [alertname = ClaudeCodeNoTelemetryReceived]
          target_matchers: [owner =~ "finops|governance"]
          equal: []

      receivers:
        - name: "null"        # intentional blackhole for severity=info

        - name: finops
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/slack-webhook
              channel: "#claude-code-alerts"      # informational: an incoming webhook is bound to its channel
              send_resolved: true
              title: '{{ .CommonLabels.alertname }} — {{ .CommonAnnotations.summary }}'
              text: |-
                {{ range .Alerts }}*{{ .Labels.severity | toUpper }}* {{ .Annotations.description }}
                {{ if .Annotations.runbook }}_Runbook:_ {{ .Annotations.runbook }}{{ end }}
                {{ end }}
              title_link: 'http://localhost:3000/d/claude-code-attribution'

        - name: governance
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/slack-webhook
              channel: "#claude-code-alerts"      # informational: an incoming webhook is bound to its channel
              send_resolved: true
              title: '{{ .CommonLabels.alertname }} — {{ .CommonAnnotations.summary }}'
              text: |-
                {{ range .Alerts }}*{{ .Labels.severity | toUpper }}* {{ .Annotations.description }}
                {{ if .Annotations.runbook }}_Runbook:_ {{ .Annotations.runbook }}{{ end }}
                {{ end }}
              title_link: 'http://localhost:3000/d/claude-code-attribution'

        - name: platform
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/slack-webhook
              channel: "#claude-code-alerts"      # informational: an incoming webhook is bound to its channel
              send_resolved: true
              title: '{{ .CommonLabels.alertname }} — {{ .CommonAnnotations.summary }}'
              text: |-
                {{ range .Alerts }}*{{ .Labels.severity | toUpper }}* {{ .Annotations.description }}
                {{ if .Annotations.runbook }}_Runbook:_ {{ .Annotations.runbook }}{{ end }}
                {{ end }}
              title_link: 'http://localhost:3000/d/claude-code-attribution'

  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  server:
    # The chart-level fullnameOverride is NOT used for the server resources —
    # prometheus.server.fullname only honors server.fullnameOverride, else it
    # prepends the release name. Pin it so the Grafana datasource URL
    # (http://prometheus-server) resolves regardless of the release name.
    fullnameOverride: prometheus-server
    retention: 365d
    # Static target instead of the chart's default kubernetes_sd pod discovery, which would need
    # cluster RBAC this bundle deliberately does not have (rbac.create: false).
    alertmanagers:
      - static_configs:
          - targets: ["alertmanager:9093"]
    persistentVolume:
      enabled: true
      size: 20Gi
  # Disable ALL of the chart's default scrape jobs (kubernetes-* cluster-wide
  # discovery, self-scrape, pushgateway) — this Prometheus monitors ONLY the
  # bundle's collector via two static targets: the Claude Code data metrics
  # (:8889) and the collector's own health metrics (:8888).
  scrapeConfigs:
    prometheus:
      enabled: false
    kubernetes-api-servers:
      enabled: false
    kubernetes-nodes:
      enabled: false
    kubernetes-nodes-cadvisor:
      enabled: false
    kubernetes-service-endpoints:
      enabled: false
    kubernetes-service-endpoints-slow:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kubernetes-services:
      enabled: false
    kubernetes-pods:
      enabled: false
    kubernetes-pods-slow:
      enabled: false
    # Claude Code metrics re-exported by the collector. honor_labels keeps the
    # exporter's own job/instance labels (job="claude-code").
    claude-code:
      enabled: true
      honor_labels: true
      static_configs:
        - targets:
            - otel-collector:8889
    # Collector self-telemetry (otelcol_* internal metrics). Prometheus sets
    # job="otel-collector"; the Collector Health dashboard queries up{job="otel-collector"}.
    otel-collector:
      enabled: true
      static_configs:
        - targets:
            - otel-collector:8888
  # Recording rules — session-free, low-cardinality series for long-range dashboards.
  # Source of truth: local/prometheus-rules.yml (keep byte-identical apart from indentation).
  # Alerting rules — source of truth: local/prometheus-alerts.yml (keep identical apart from
  # indentation; the Loki-candidate comment block is intentionally not mirrored). Routed by the
  # bundled Alertmanager above (prometheus.alertmanager.config).
  serverFiles:
    alerting_rules.yml:
      groups:
        - name: claude_code.finops
          rules:
            # A single engineer's last 24h spend is >3x their own trailing 7-day daily average AND above a
            # dollar floor (so a quiet user going from $1 to $4 doesn't page anyone).
            - alert: ClaudeCodeUserSpendSpike
              expr: >
                sum by (organization_id, user_email) (increase(claude_code_cost_usage_USD_total[1d])) > 25
                and
                sum by (organization_id, user_email) (increase(claude_code_cost_usage_USD_total[1d]))
                  > 3 * (sum by (organization_id, user_email) (increase(claude_code_cost_usage_USD_total[7d] offset 1d)) / 7)
              for: 30m
              labels: {severity: warning, owner: finops}
              annotations:
                summary: "Claude Code spend spike for {{ $labels.user_email }}"
                description: "{{ $labels.user_email }} spent ${{ $value | printf \"%.2f\" }} in the last 24h, >3x their trailing 7-day daily average."
                runbook: "Open Usage Audit filtered to the user; check model/effort mix and subagent fan-out in Session Explorer."

            # Same signal at project level — a runaway agent loop or a new team onboarding.
            - alert: ClaudeCodeProjectSpendSpike
              expr: >
                sum by (organization_id, project) (increase(claude_code_cost_usage_USD_total[1d])) > 100
                and
                sum by (organization_id, project) (increase(claude_code_cost_usage_USD_total[1d]))
                  > 2.5 * (sum by (organization_id, project) (increase(claude_code_cost_usage_USD_total[7d] offset 1d)) / 7)
              for: 1h
              labels: {severity: warning, owner: finops}
              annotations:
                summary: "Claude Code spend spike on project {{ $labels.project }}"
                description: "Project {{ $labels.project }} spent ${{ $value | printf \"%.2f\" }} in the last 24h, >2.5x its trailing daily average."

            # Prompt-cache efficiency collapsed for a project that is spending real money.
            - alert: ClaudeCodeCacheHitRatioLow
              expr: >
                (
                  sum by (organization_id, project) (increase(claude_code_token_usage_tokens_total{type="cacheRead"}[1d]))
                  /
                  sum by (organization_id, project) (increase(claude_code_token_usage_tokens_total{type=~"input|cacheRead|cacheCreation"}[1d]))
                ) < 0.5
                and
                sum by (organization_id, project) (increase(claude_code_cost_usage_USD_total[1d])) > 50
              for: 2h
              labels: {severity: info, owner: finops}
              annotations:
                summary: "Low prompt-cache hit ratio on {{ $labels.project }}"
                description: "Cache hit ratio {{ $value | humanizePercentage }} over 24h with >$50 spend — many short sessions or cold-context patterns."

        - name: claude_code.governance
          rules:
            # Attribution rollout regressing: >10% of the day's spend arrived without a project tag.
            - alert: ClaudeCodeAttributionCoverageLow
              expr: >
                (
                  sum(increase(claude_code_cost_usage_USD_total{project="unattributed"}[1d])) or vector(0)
                )
                / sum(increase(claude_code_cost_usage_USD_total[1d])) > 0.10
                and sum(increase(claude_code_cost_usage_USD_total[1d])) > 10
              for: 1h
              labels: {severity: warning, owner: governance}
              annotations:
                summary: "Claude Code attribution coverage below 90%"
                description: "{{ $value | humanizePercentage }} of the last 24h spend is unattributed. Open Attribution Health for who is launching untagged sessions."
                runbook: "Push client/managed-settings.json via MDM; put client/claude-attr on PATH."

            # Someone is minting malformed Jira keys (typo in branch name / git config claude.jiraEpic).
            - alert: ClaudeCodeInvalidJiraKeys
              expr: >
                count by (organization_id, user_email) (
                  present_over_time(claude_code_session_count_total{jira_story="invalid"}[1d])
                  or present_over_time(claude_code_session_count_total{jira_epic="invalid"}[1d])
                ) > 0
              for: 1h
              labels: {severity: info, owner: governance}
              annotations:
                summary: "Malformed Jira keys from {{ $labels.user_email }}"
                description: "{{ $value }} session(s) in 24h carried a jira.epic/jira.story that failed validation and were stamped `invalid`."

            # Fleet hygiene: sessions from client versions outside the allowed set. Update the regex when
            # you raise the floor (managed settings can't pin the CLI version; this is the detective control).
            - alert: ClaudeCodeUnsupportedClientVersion
              expr: >
                count by (organization_id, user_email, service_version) (
                  present_over_time(claude_code_session_count_total{service_version!~"2\\.1\\.(25[5-9]|2[6-9][0-9])"}[1d])
                ) > 0
              for: 6h
              labels: {severity: info, owner: platform}
              annotations:
                summary: "Outdated Claude Code {{ $labels.service_version }} in use by {{ $labels.user_email }}"
                description: "Below the supported floor; older clients may lack telemetry fields the dashboards rely on."

        - name: claude_code.pipeline
          rules:
            # The Prometheus scrape of the collector's Claude Code metrics endpoint is failing.
            - alert: ClaudeCodeCollectorScrapeDown
              expr: up{job="claude-code"} == 0
              for: 5m
              labels: {severity: critical, owner: platform}
              annotations:
                summary: "Claude Code telemetry collector not scrapeable"
                description: "Prometheus cannot reach the collector's :8889 metrics endpoint. Dashboards go flat; client exports queue then drop."

            # The collector is failing to hand data to Loki / Prometheus exporter.
            - alert: ClaudeCodeCollectorExportFailures
              expr: >
                sum by (exporter) (
                  increase(otelcol_exporter_send_failed_log_records[10m])
                  or increase(otelcol_exporter_send_failed_metric_points[10m])
                ) > 0
              for: 10m
              labels: {severity: warning, owner: platform}
              annotations:
                summary: "Collector export failures ({{ $labels.exporter }})"
                description: "{{ $value }} records failed to export in 10m. Check Loki readiness / collector logs."

            # Collector alive but no Claude Code telemetry during weekday working hours. Uses token usage,
            # which every live session re-exports continuously; session_count only appears when a session
            # *starts* (the collector's Prometheus exporter drops idle series after 5 min).
            - alert: ClaudeCodeNoTelemetryReceived
              expr: >
                absent_over_time(claude_code_token_usage_tokens_total[8h])
                and on() (day_of_week() >= 1 and day_of_week() <= 5 and hour() >= 12 and hour() <= 20)
              for: 1h
              labels: {severity: warning, owner: platform}
              annotations:
                summary: "No Claude Code telemetry received in 8h on a weekday"
                description: "Either nobody is using Claude Code or the client env (managed settings / endpoint / auth) broke. Verify with one manual session."
    recording_rules.yml:
      groups:
        - name: claude_code.attribution
          interval: 1m
          rules:
            # USD/s by business dimension (multiply by a window to get spend; sum_over_time for totals).
            - record: claude_code:cost_usd:rate5m
              expr: >
                sum by (collector_env, organization_id, user_email, project, jira_epic, model)
                  (rate(claude_code_cost_usage_USD_total[5m]))

            # tokens/s by business dimension and token type (input/output/cacheRead/cacheCreation).
            - record: claude_code:tokens:rate5m
              expr: >
                sum by (collector_env, organization_id, user_email, project, jira_epic, model, type)
                  (rate(claude_code_token_usage_tokens_total[5m]))

            # active seconds/s by business dimension and type (user vs cli).
            - record: claude_code:active_time_seconds:rate5m
              expr: >
                sum by (collector_env, organization_id, user_email, project, jira_epic, type)
                  (rate(claude_code_active_time_seconds_total[5m]))

            # Hourly spend per project/epic — the series the FinOps "cost by epic" views should trend.
            - record: claude_code:cost_usd:increase1h
              expr: >
                sum by (collector_env, organization_id, project, jira_epic)
                  (increase(claude_code_cost_usage_USD_total[1h]))

        - name: claude_code.governance
          interval: 1m
          rules:
            # Share of spend that arrived without a project tag (collector stamps `unattributed`).
            # Target: trend to 0 as the launcher/managed settings roll out.
            - record: claude_code:cost_usd_unattributed:ratio_rate5m
              expr: >
                sum(rate(claude_code_cost_usage_USD_total{project="unattributed"}[5m]))
                /
                sum(rate(claude_code_cost_usage_USD_total[5m]))

            # Share of spend carrying a malformed Jira key (collector stamps `invalid`).
            - record: claude_code:cost_usd_invalid_jira:ratio_rate5m
              expr: >
                sum(rate(claude_code_cost_usage_USD_total{jira_epic="invalid"}[5m]) or rate(claude_code_cost_usage_USD_total{jira_story="invalid"}[5m]))
                /
                sum(rate(claude_code_cost_usage_USD_total[5m]))

# Visualization (grafana/grafana subchart).
grafana:
  enabled: true
  fullnameOverride: grafana
  # Namespace-scoped RBAC only; the dashboard sidecar watches this namespace anyway.
  rbac:
    namespaced: true
  testFramework:
    enabled: false

  # --- Single sign-on (OIDC via Grafana generic OAuth — Keycloak or any OIDC provider) ---
  # Everything SSO hangs off ONE Kubernetes Secret — `grafana-sso` — with three keys:
  #   username / password  -> Grafana admin login (admin.existingSecret below)
  #   clientSecret         -> OAuth client secret (envValueFrom below + KeycloakClient ref)
  # Create it either way (this chart never renders Secrets itself):
  #   kubectl: kubectl create secret generic grafana-sso \
  #              --from-literal=username=<admin> --from-literal=password=<pass> \
  #              --from-literal=clientSecret=<oauth-client-secret>
  #   ESO:     eso.enabled=true — materialized from your secret manager (same three keys)
  # To expose Grafana under SSO:
  #   1. create the grafana-sso Secret (kubectl or ESO), uncomment envValueFrom and admin,
  #   2. flip auth.generic_oauth.enabled=true and point the URLs at your provider,
  #   3. enable the ingress and set server.root_url to the same host,
  #   4. register the OIDC client at your provider — either by hand, or set
  #      keycloakClient.create=true to render a KeycloakClient CR through the
  #      keycloak-operator add-on (consuming $grafana-sso:clientSecret).

  # envValueFrom:
  #   GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
  #     secretKeyRef:
  #       name: grafana-sso
  #       key: clientSecret

  grafana.ini:
    analytics:
      check_for_updates: false
    server:
      root_url: https://grafana.example.com
    auth.generic_oauth:
      enabled: false
      name: SSO
      auto_login: false
      allow_sign_up: true
      client_id: grafana-claude-code-telemetry
      # Client secret comes from the GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET env var (envValueFrom above) — never inline it here.
      scopes: openid profile email roles
      email_attribute_path: email
      # Keycloak endpoints (any OIDC provider exposes equivalents):
      auth_url: https://keycloak.example.com/realms/main/protocol/openid-connect/auth
      token_url: https://keycloak.example.com/realms/main/protocol/openid-connect/token
      api_url: https://keycloak.example.com/realms/main/protocol/openid-connect/userinfo
      # Map provider roles/groups to Grafana org roles (JMESPath over the userinfo/token claims).
      role_attribute_path: contains(roles[*], 'administrator') && 'Admin' || contains(roles[*], 'developer') && 'Editor' || 'Viewer'

  # Grafana admin credentials from the same grafana-sso Secret.
  # admin:
  #   existingSecret: grafana-sso
  #   userKey: username
  #   passwordKey: password

  ingress:
    enabled: false
    annotations: {}
    hosts:
      - grafana.example.com
    path: /
    pathType: Prefix
    tls: []
    # - secretName: grafana-tls
    #   hosts: [grafana.example.com]
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      # Place each dashboard into the folder named by its `grafana_folder` annotation.
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  # Datasource UIDs match local/grafana provisioning so dashboards work unchanged.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          url: http://prometheus-server
          isDefault: true
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki:3100
        # Bundled Alertmanager: Grafana Alerting shows firing Claude Code alerts + silences.
        - name: Alertmanager
          type: alertmanager
          uid: alertmanager
          access: proxy
          url: http://alertmanager:9093
          jsonData:
            implementation: prometheus
            handleGrafanaManagedAlerts: false

# This section enables configuration for using External Secrets Operator (ESO) as the
# secret manager: it renders a SecretStore plus ONE ExternalSecret that materializes the
# `grafana-sso` Secret (fixed name, fixed keys: username, password, clientSecret).
# Store the secret in your provider at `secretPath` as a JSON object with exactly
# those three properties:
#   {"username": "<grafana-admin>", "password": "<grafana-admin-pass>", "clientSecret": "<oauth-client-secret>"}
# Without ESO, create the identical Secret manually instead:
#   kubectl -n <namespace> create secret generic grafana-sso \
#     --from-literal=username=<grafana-admin> \
#     --from-literal=password=<grafana-admin-pass> \
#     --from-literal=clientSecret=<oauth-client-secret>
# Prerequisite: ESO controller available — either pre-installed in the cluster or via
# the optional `external-secrets` subchart at the bottom of this file.
# https://docs.kuberocketci.io/docs/operator-guide/secrets-management/external-secrets-operator-integration
eso:
  # -- Render the SecretStore/ExternalSecret resources.
  enabled: false
  # -- API version for the SecretStore/ExternalSecret resources. Match the CRD
  # version served by the ESO controller in the target cluster (`external-secrets.io/v1`
  # for ESO >= 0.10, or `external-secrets.io/v1beta1` for older installs).
  apiVersion: "external-secrets.io/v1"
  # -- Defines provider type. One of `aws`, `generic`, or `vault`.
  provider: "generic"
  # -- Defines the path to the secret in the provider. If provider is `vault`, the path must be prefixed with `secret/`.
  secretPath: "/infra/claude-code-telemetry"
  # -- Vault configuration (if provider is `vault`).
  vault:
    # -- Vault server URL.
    server: "http://vault.vault:8200"
    # -- Mount path for the Kubernetes authentication method.
    mountPath: "core"
    # -- Vault role for the Kubernetes authentication method.
    role: claude-code-telemetry
  # -- AWS configuration (if provider is `aws`).
  aws:
    # -- AWS region.
    region: "eu-central-1"
    # -- AWS role ARN for the ExternalSecretOperator to assume.
    roleArn: "arn:aws:iam::012345678910:role/AWSIRSA_Shared_ExternalSecretOperatorAccess"
  generic:
    secretStore:
      # -- Defines SecretStore provider configuration.
      providerConfig: {}
      #  gcpsm:
      #    projectID: "alphabet-123"

# Grafana SSO Keycloak client. When enabled, the chart renders a KeycloakClient CR
# (roles + groups protocol mappers) managed by the KubeRocketCI keycloak-operator — a
# convenience for clusters that run it as an add-on. The chart does NOT install the
# operator; prerequisite:
#   https://github.com/epam/edp-cluster-add-ons/tree/main/clusters/core/addons/keycloak-operator
# Leave `create: false` for a manual OIDC setup — register the client at your provider
# (Keycloak or any other) yourself. Grafana SSO works either way: it depends only on the
# `grafana-sso` Secret (key `clientSecret`, created with kubectl or ESO — see the `eso`
# section above) and the grafana `generic_oauth` config, NOT on this block. The chart never
# renders a Kubernetes Secret; the KeycloakClient CR reads `$grafana-sso:clientSecret` to
# set the client secret in Keycloak.
keycloakClient:
  # -- Render a KeycloakClient CR for Grafana SSO via the KubeRocketCI keycloak-operator.
  create: false
  # -- OAuth client ID; keep in sync with grafana.grafana\.ini.auth\.generic_oauth.client_id.
  clientId: grafana
  # -- Grafana external URL (OAuth redirect base); keep in sync with grafana ingress host and server.root_url.
  grafanaUrl: https://grafana.example.com
  # -- Keycloak realm the client is created in.
  realmRef:
    kind: ClusterKeycloakRealm
    name: main

# Optional External Secrets Operator subchart (external-secrets/external-secrets).
# Disabled by default — the bundle stays free of cluster-wide/CRD dependencies unless
# you opt in. If ESO already runs in the cluster (e.g. via the edp-cluster-add-ons
# external-secrets add-on), leave this off and only enable the `eso` block above.
# NOTE: when enabling this subchart AND `eso` together for the first time, install in
# two steps — first with only `external-secrets.enabled=true` (CRDs + validating webhook
# must be up), then upgrade with `eso.enabled=true` — otherwise the ExternalSecret CRs
# fail admission ("failed calling webhook ... connection refused").
external-secrets:
  enabled: false
  installCRDs: true
  # To keep the operator namespace-scoped (no cluster-wide RBAC)
  scopedNamespace: claude-code-telemetry
  scopedRBAC: true
