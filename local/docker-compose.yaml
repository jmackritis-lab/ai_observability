# Local Claude Code usage-audit stack (debug).
# Claude Code --(OTLP :4317)--> otel-collector --> Prometheus (metrics) + Loki (events)
#                                                          \--> Grafana (dashboards)
#                                                 Prometheus --(alerts)--> Alertmanager (:9093)

# Start:  docker compose up -d      Stop: docker compose down      Wipe: docker compose down -v
name: claude-code-telemetry

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC  <- Claude Code
      - "4318:4318"   # OTLP HTTP  <- Claude Code (alternative)
    depends_on: [prometheus, loki]

  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/rules/claude-code.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/rules/claude-code-alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on: [alertmanager]

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.33.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/etc/alertmanager/secrets:ro   # slack-webhook lives here, git-ignored
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"   # Alertmanager UI: firing alerts, silences, routing tree

  loki:
    image: grafana/loki:3.6.7
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "dark"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, loki]

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:
