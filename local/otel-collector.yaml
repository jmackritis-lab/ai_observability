# LOCAL collector config — self-contained, hardcoded for the docker-compose stack.
# Iterate here; once validated, replicate the change into the Helm chart's pipeline
# (deploy-templates/values.yaml -> opentelemetry-collector.alternateConfig).
#
# Receives OTLP from Claude Code, fans metrics to Prometheus and events/logs to Loki.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# The k8s Deployment's liveness/readiness probes target this endpoint (:13133);
# harmless locally, required in the Helm bundle.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  batch:
    timeout: 5s
  # Tag everything so multiple sources (laptops, CI) are distinguishable in one backend.
  resource:
    attributes:
      - key: collector.env
        value: local-poc
        action: upsert

  # Attribution enforcement (docs/analytics.md §4) — the server-side, user-unbypassable point.
  # 1) Missing business dimensions get the sentinel `unattributed` so the share of un-tagged
  #    spend is queryable (project="unattributed") instead of silently vanishing into an empty label.
  #    (`none` remains the *user-set* sentinel for "does not apply" — see §3.3 — so the two are distinguishable.)
  # 2) Jira keys are normalized to upper case and validated against ^[A-Z][A-Z0-9]*-[0-9]+$;
  #    anything else becomes `invalid` so a typo can't mint a bogus epic/story label.
  # 3) `project` is lower-cased and restricted to [a-z0-9._-] (a repository name).
  # Identical statements for metrics and logs so Prometheus labels and Loki labels agree.
  # NOTE: session.id / jira.story are deliberately NOT stripped here — see docs/analytics.md §3.2.
  transform/attribution:
    error_mode: ignore
    metric_statements: &attribution_statements
      - context: resource
        statements:
          - set(attributes["project"], "unattributed") where attributes["project"] == nil or attributes["project"] == ""
          - set(attributes["jira.epic"], "unattributed") where attributes["jira.epic"] == nil or attributes["jira.epic"] == ""
          - set(attributes["jira.story"], "unattributed") where attributes["jira.story"] == nil or attributes["jira.story"] == ""
          - set(attributes["project"], ConvertCase(attributes["project"], "lower"))
          - set(attributes["project"], "invalid") where not IsMatch(attributes["project"], "^[a-z0-9._-]+$")
          - set(attributes["jira.epic"], ConvertCase(attributes["jira.epic"], "upper")) where IsMatch(attributes["jira.epic"], "^[A-Za-z][A-Za-z0-9]*-[0-9]+$")
          - set(attributes["jira.epic"], "invalid") where not IsMatch(attributes["jira.epic"], "^([A-Z][A-Z0-9]*-[0-9]+|none|unattributed)$")
          - set(attributes["jira.story"], ConvertCase(attributes["jira.story"], "upper")) where IsMatch(attributes["jira.story"], "^[A-Za-z][A-Za-z0-9]*-[0-9]+$")
          - set(attributes["jira.story"], "invalid") where not IsMatch(attributes["jira.story"], "^([A-Z][A-Z0-9]*-[0-9]+|none|unattributed)$")
    log_statements: *attribution_statements

exporters:
  # Metrics -> Prometheus scrape endpoint on :8889.
  # Claude Code metrics are OTel counters, so Prometheus names carry the unit + `_total` suffix
  # (claude_code.token.usage -> claude_code_token_usage_tokens_total,
  #  claude_code.cost.usage -> claude_code_cost_usage_USD_total,
  #  claude_code.session.count -> claude_code_session_count_total). Dashboards query these names.
  # resource_to_telemetry_conversion turns resource attrs (project, jira.ticket, user.email, session.id...)
  # into Prometheus labels so we can break tokens/cost down by them.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  # Events/logs -> Loki native OTLP ingest. Resource attrs become Loki labels;
  # event attributes (tool_name, skill.name, agent.name, decision, ...) become structured metadata.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  # Prints everything to `docker compose logs otel-collector` — handy to confirm data flows
  # and to discover exact attribute names. Set to `basic` once verified.
  debug:
    verbosity: detailed

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource, transform/attribution, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [resource, transform/attribution, batch]
      exporters: [otlphttp/loki, debug]
  telemetry:
    logs:
      level: info
    # Collector self-observability: expose internal otelcol_* metrics on :8888 for the
    # "Collector Health" dashboard (Prometheus scrapes this as the `otel-collector` job).
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
